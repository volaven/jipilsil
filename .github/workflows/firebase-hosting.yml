name: deploy-firebase
# 앱 코드만 _site 로 모아서 내 Firebase Hosting 에 올려요 (원고는 저장소에 없어요).
# 처음 한 번 설정 (DRIVE_SETUP.md 0단계): 저장소 Settings → Secrets and variables → Actions
#   - Variables 탭: FIREBASE_PROJECT_ID = 내 Firebase 프로젝트 ID
#   - Secrets 탭:   FIREBASE_SERVICE_ACCOUNT = 배포용 서비스 계정 JSON 키 전체
# 둘 중 하나라도 없으면 배포를 건너뛰고 경고만 남겨요.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-hosting
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      READY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && vars.FIREBASE_PROJECT_ID != '' }}
    steps:
      - name: Firebase 설정 확인
        if: env.READY != 'true'
        run: echo "::warning::FIREBASE_PROJECT_ID 변수와 FIREBASE_SERVICE_ACCOUNT 비밀을 넣으면 자동 배포돼요 (DRIVE_SETUP.md 0단계). 이번에는 건너뛰어요."
      - uses: actions/checkout@v4
        if: env.READY == 'true'
      - uses: actions/setup-node@v4
        if: env.READY == 'true'
        with:
          node-version: 24
      - name: Build site (app code only)
        if: env.READY == 'true'
        run: node scripts/build-site.mjs && ls -la _site _site/icons _site/img
      - name: Deploy to Firebase Hosting
        if: env.READY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
